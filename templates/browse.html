<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de archivos</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      padding: 20px;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    .path {
      font-family: monospace;
      color: #facc15;
      word-break: break-all;
    }
    .item {
      display: block;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      text-decoration: none;
      color: #f5f5f5;
    }
    .item:hover {
      background: #222;
    }
    .back {
      display: inline-block;
      margin-bottom: 12px;
      color: #facc15;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h2>Files</h2>
      <div class="path">{{ current_path }}</div>
    </div>

    {% if parent_path %}
      <a class="back" href="{{ parent_path }}">← Back</a>
    {% endif %}

    {% for item in items %}
      <a class="item" href="{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
  </div>
</body>
</html>
