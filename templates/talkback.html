<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicam • Talkback</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 24px; }
    .card { background: #1f2937; padding: 24px; border-radius: 12px; max-width: 480px; margin: 0 auto; }
    button { padding: 16px 24px; border: 0; border-radius: 999px; font-size: 18px; cursor: pointer; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Talkback</h1>
    <p>Press and hold to talk through the Pi speaker.</p>
    <button id="ptt">🎙️ Talk</button>
    <div id="status" style="margin-top: 12px; font-weight: 600;">Free</div>
  </div>
  <script>
    let ws;
    let talking = false;
    const status = document.getElementById('status');
    const ptt = document.getElementById('ptt');
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    function setStatus(text) { status.textContent = text; }
    function connect() {
      ws = new WebSocket(`${protocol}://${location.host}/talkback`);
      ws.onmessage = (event) => {
        if (event.data === 'granted') {
          talking = true;
          setStatus('Talking...');
        } else if (event.data === 'busy') {
          talking = false;
          setStatus('Busy');
        } else if (event.data === 'released') {
          talking = false;
          setStatus('Free');
        }
      };
    }
    const sendPtt = (value) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(value);
      }
    };
    ptt.addEventListener('mousedown', () => sendPtt('__PTT_DOWN__'));
    ptt.addEventListener('touchstart', (event) => { event.preventDefault(); sendPtt('__PTT_DOWN__'); });
    ptt.addEventListener('mouseup', () => sendPtt('__PTT_UP__'));
    ptt.addEventListener('mouseleave', () => sendPtt('__PTT_UP__'));
    ptt.addEventListener('touchend', () => sendPtt('__PTT_UP__'));
    connect();
  </script>
</body>
</html>
